<html lang="fr">
<head>

<title>Gestion de promotion immobilière</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" type="image/png" href="icon.png">
<meta name="theme-color" content="#0b3b4a">

<style>
@property --p{syntax:'<number>';inherits:false;initial-value:0}
:root{color-scheme:light;--bg:#f3faff;--card:#fff;--ink:#15324d;--mute:#58728c;--line:#d9e8f3;--main:#1b8fd6;--main-2:#16b5ad;--main-ink:#fff;--accent:#ff9f43;--ok:#1fa86b;--warn:#e08a1e;--bad:#e85d5d;--blue:#2f9be0;--or:#ff8a3d;--shadow:0 1px 2px rgba(27,120,190,.07),0 12px 28px -16px rgba(27,120,190,.30);--r:16px}
@media not all{:root{--bg:#0b141c;--card:#132029;--ink:#e6eef3;--mute:#8da2b2;--line:#233441;--main:#5aa2f0;--main-2:#4cc3e6;--main-ink:#052029;--accent:#f4b251;--ok:#4cc79a;--warn:#f0b04a;--bad:#f0786d;--blue:#74a8f2;--or:#ff9a3c;--shadow:0 1px 2px rgba(0,0,0,.4),0 10px 26px -14px rgba(0,0,0,.7)}}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:linear-gradient(180deg,#e6f5ff 0,#f5fbff 360px,#f2fbf7 100%) fixed;color:var(--ink);font:15px/1.55 Figtree,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
h1,h2,h3,.kpi b,.hb,.pm{font-family:'Bricolage Grotesque',Figtree,system-ui,sans-serif}
h2{margin:0 0 16px;font-size:29px;font-weight:800;letter-spacing:-.02em}
h3{font-weight:700}
h3.sec{margin:28px 0 12px;font-size:18px}
.shell{display:flex;min-height:100vh}
.side{width:246px;flex:none;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:20px;padding:22px 14px;background:linear-gradient(180deg,#ffffff 0%,#eaf6ff 58%,#e0f6f1 100%);color:#17406b;border-right:1px solid #d3e6f4;box-shadow:8px 0 26px -20px rgba(27,143,214,.55)}
.hb{display:flex;align-items:center;gap:11px;background:none;border:0;color:inherit;font-size:17px;font-weight:800;line-height:1.15;text-align:left;cursor:pointer;padding:4px 6px}
.hb svg{width:38px;height:38px;flex:none;color:var(--accent)}
nav{display:flex;flex-direction:column;gap:3px;overflow:auto}
nav button{display:flex;align-items:center;gap:12px;width:100%;padding:10px 12px;border:0;border-radius:10px;background:transparent;color:rgba(232,242,247,.78);font-weight:600;cursor:pointer;text-align:left;position:relative;transition:background .2s,color .2s}
nav button svg{width:20px;height:20px;flex:none}
nav button:hover{background:rgba(255,255,255,.08);color:#fff}
nav button.on{background:rgba(255,255,255,.14);color:#fff}
nav button.on::before{content:'';position:absolute;left:-14px;top:9px;bottom:9px;width:4px;border-radius:0 4px 4px 0;background:var(--accent)}
.content{flex:1;min-width:0}
.topbar{position:sticky;top:0;z-index:10;display:flex;gap:10px;align-items:center;padding:12px 28px;background:color-mix(in srgb,var(--bg) 82%,transparent);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.search{position:relative;flex:1;max-width:460px}
.search svg{position:absolute;left:13px;top:50%;translate:0 -50%;width:18px;height:18px;color:var(--mute);pointer-events:none}
.search input{padding-left:40px;border-radius:999px}
#cur{width:auto;border-radius:999px;font-weight:600}
#sr{position:absolute;left:28px;top:calc(100% - 2px);width:min(480px,calc(100vw - 56px));max-height:60vh;overflow:auto;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:14px;box-shadow:0 18px 40px -16px rgba(8,25,40,.5)}
#sr:not([hidden]){animation:pop .18s cubic-bezier(.2,.8,.2,1)}
.res{display:block;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:11px 16px;cursor:pointer;color:inherit;font:inherit;transition:background .15s}
.res:hover{background:color-mix(in srgb,var(--main) 8%,transparent)}
.res small{color:var(--mute)}
main{max-width:1240px;margin:0 auto;padding:26px 28px 60px}
main.enter{animation:enter .3s cubic-bezier(.2,.8,.2,1)}
main.enter .kpis>*,main.enter .pjs>*{animation:rise .55s cubic-bezier(.2,.8,.2,1) backwards}
main.enter .kpis>*:nth-child(2),main.enter .pjs>*:nth-child(2){animation-delay:.05s}
main.enter .kpis>*:nth-child(3),main.enter .pjs>*:nth-child(3){animation-delay:.1s}
main.enter .kpis>*:nth-child(4),main.enter .pjs>*:nth-child(4){animation-delay:.15s}
main.enter .kpis>*:nth-child(5),main.enter .pjs>*:nth-child(5){animation-delay:.2s}
main.enter .kpis>*:nth-child(n+6),main.enter .pjs>*:nth-child(n+6){animation-delay:.25s}
@keyframes enter{from{opacity:0;transform:translateY(12px);filter:blur(3px)}}
@keyframes rise{from{opacity:0;transform:translateY(14px) scale(.98)}}
@keyframes pop{from{opacity:0;transform:translateY(10px) scale(.97)}}
@keyframes fade{from{opacity:0}}
@keyframes grow{from{transform:scaleX(0)}}
@keyframes ringin{from{--p:0}}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px;margin-bottom:18px}
.kpi{position:relative;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;box-shadow:var(--shadow)}
.kpi b{display:block;font-size:28px;line-height:1.1;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.kpi span{display:block;margin-top:6px;color:var(--mute);font-size:13px}
.kpi[style*="--k"] span::before{content:'';display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--k);margin-right:7px;vertical-align:1px}
button.kpi{display:block;width:100%;text-align:left;font:inherit;color:inherit;cursor:pointer;transition:transform .22s cubic-bezier(.2,.8,.2,1),box-shadow .22s,border-color .22s}
button.kpi:hover{transform:translateY(-3px);border-color:var(--main);box-shadow:0 16px 32px -16px rgba(11,110,142,.5)}
div.kplink:hover{transform:translateY(-3px);border-color:var(--main);box-shadow:0 16px 32px -16px rgba(11,110,142,.5)}.kplink{transition:transform .22s,box-shadow .22s,border-color .22s}

.phgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px;margin:12px 0}
.phf{margin:0;background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;box-shadow:var(--shadow)}
.phf img{display:block;width:100%;height:170px;object-fit:cover;background:var(--line);cursor:zoom-in}
.phfile{height:170px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;background:var(--line);cursor:pointer;padding:8px;text-align:center}.phfile small{word-break:break-all;color:var(--mute);font-size:11px}
.phf figcaption{padding:10px 12px;display:flex;flex-direction:column;gap:3px;font-size:13px}.phf small{color:var(--mute)}.phf span{display:flex;gap:12px}
button.kpi:active{transform:translateY(-1px) scale(.99)}
.kpi:has(.ring){padding-right:92px}
.ring{position:absolute;right:16px;top:16px;width:60px;height:60px;border-radius:50%;background:conic-gradient(var(--k,var(--main)) calc(var(--p)*1%),var(--line) 0);-webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 8px),#000 calc(100% - 7px));mask:radial-gradient(farthest-side,transparent calc(100% - 8px),#000 calc(100% - 7px));animation:ringin 1.2s cubic-bezier(.2,.8,.2,1)}
.pjs{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:16px;margin-bottom:22px}
.pj{padding:18px 20px!important}
.pj b{font-size:21px}
.pj small{display:block;margin:9px 0 4px;color:var(--mute)}
.pm{display:grid;place-items:center;width:46px;height:46px;border-radius:13px;background:hsl(var(--h) 52% 38%);color:#fff;font-size:17px;font-weight:800;font-style:normal;margin-bottom:12px}
.bar{background:var(--line);border-radius:999px;height:8px;overflow:hidden;min-width:80px}
.bar i,.cb{display:block;height:100%;border-radius:999px;transform-origin:left;animation:grow .9s cubic-bezier(.2,.8,.2,1)}
.bar i{background:linear-gradient(90deg,var(--main),var(--main-2))}
.tools{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px;align-items:center}
.wrap{overflow-x:auto;background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th,td{padding:11px 14px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:12.5px;color:var(--mute);font-weight:600;background:color-mix(in srgb,var(--bg) 55%,var(--card))}
tbody tr{transition:background .15s}
tbody tr:hover{background:color-mix(in srgb,var(--main) 6%,transparent)}
tr:last-child td{border-bottom:0}
button,select,input{font:inherit;color:inherit}
.btn{background:linear-gradient(135deg,var(--main),var(--main-2));color:var(--main-ink);border:0;border-radius:10px;padding:9px 16px;font-weight:700;cursor:pointer;box-shadow:0 8px 16px -10px var(--main);transition:transform .15s,box-shadow .2s,filter .2s}
.btn:hover{filter:brightness(1.07);box-shadow:0 12px 22px -10px var(--main)}
.btn:active{transform:scale(.97)}
.ghost{background:transparent;color:var(--ink);border:1px solid var(--line);box-shadow:none}
.ghost:hover{background:color-mix(in srgb,var(--main) 8%,transparent);border-color:var(--main);filter:none;box-shadow:none}
.sm{padding:4px 10px;font-size:13px;border-radius:8px}
select,input,textarea{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:9px 12px;width:100%;transition:border-color .15s,box-shadow .15s}
select:focus,input:focus,textarea:focus{outline:none;border-color:var(--main);box-shadow:0 0 0 3px color-mix(in srgb,var(--main) 24%,transparent)}
.tools select{width:auto}
.n{width:110px}
td select{width:auto;max-width:170px}
:focus-visible{outline:2px solid var(--main);outline-offset:2px}
.lk{background:none;border:0;color:var(--main);font-weight:800;cursor:pointer;text-decoration:underline;text-underline-offset:3px;padding:0}
.lk:hover{color:var(--main-2)}
.sec{margin:16px 0 8px}
summary{cursor:pointer}
.tag{display:inline-block;padding:2px 10px;border-radius:999px;font-size:12px;font-weight:700;background:color-mix(in srgb,currentColor 14%,transparent)}
.Disponible{color:var(--blue)}.Réservé{color:var(--warn)}.Vendu{color:var(--ok)}.Alouer,.Àlouer{color:var(--bad)}.Loué{color:var(--main)}
.Afaire,.Àfaire{color:var(--mute)}.Encours{color:var(--warn)}.Terminé{color:var(--ok)}.Payé{color:var(--ok)}.Àpayer{color:var(--bad)}
.Rupture{color:var(--bad)}.quick{display:flex;gap:10px;flex-wrap:wrap;margin:0 0 16px}.quick .btn{padding:14px 18px;font-size:15px}.Hôtellerie{color:var(--or)}.c-enc{color:var(--ok)}.c-nenc{color:var(--or)}.c-dep{color:var(--bad)}.c-zero{color:var(--mute);font-weight:400}.leg{display:flex;gap:16px;flex-wrap:wrap;font-weight:700;margin:0 0 12px}.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px;margin-top:14px}.two h3{margin:0 0 8px}.Àcommander{color:var(--warn)}.OK{color:var(--ok)}.Vide{color:var(--mute)}.Commandé{color:var(--warn)}.Reçu{color:var(--ok)}.Entrée{color:var(--ok)}.Sortie{color:var(--blue)}
nav button[data-v=home] svg{color:#8fd3ff}nav button[data-v=dash] svg{color:#ffd37a}nav button[data-v=projects] svg{color:#c3a8ff}nav button[data-v=etat] svg{color:#9be3c0}nav button[data-v=units] svg{color:#ff9fb2}nav button[data-v=buyers] svg{color:#8fd3ff}nav button[data-v=dues] svg{color:#ffb98a}nav button[data-v=build] svg{color:#ffd37a}nav button[data-v=stock] svg{color:#7ee0d4}nav button[data-v=charges] svg{color:#ff9fb2}nav button[data-v=bilan] svg{color:#9be3c0}nav button[data-v=rent] svg{color:#c3a8ff}nav button[data-v=ai] svg{color:#ffd37a}nav button[data-v=data] svg{color:#b4c3cf}
.kpi[style*="--k"]{background:linear-gradient(160deg,color-mix(in srgb,var(--k) 10%,var(--card)),var(--card) 62%)}
.chatbox{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:16px;display:flex;flex-direction:column;gap:12px;margin-bottom:16px}
#msgs{display:flex;flex-direction:column;gap:10px;max-height:52vh;min-height:220px;overflow:auto;padding:4px}
.msg{max-width:86%;padding:10px 14px;border-radius:16px;line-height:1.5;animation:rise .3s cubic-bezier(.2,.8,.2,1)}
.msg.me{align-self:flex-end;background:linear-gradient(135deg,var(--main),var(--main-2));color:var(--main-ink);border-bottom-right-radius:5px}
.msg.ai{align-self:flex-start;background:color-mix(in srgb,var(--main) 8%,var(--card));border:1px solid var(--line);border-bottom-left-radius:5px}
.msg.err{border-color:var(--bad);color:var(--bad)}
.msg ul{margin:6px 0;padding-left:20px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 12px;font-size:13px;cursor:pointer;transition:background .15s,border-color .15s}
.chip:hover{border-color:var(--main);background:color-mix(in srgb,var(--main) 8%,var(--card))}
.compose{display:flex;gap:10px;align-items:flex-end}
.compose textarea{resize:vertical;min-height:46px}
.dots{display:inline-flex;gap:4px;padding:4px 0}.dots i{width:7px;height:7px;border-radius:50%;background:var(--mute);animation:blink 1s infinite}.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
@keyframes blink{0%,80%,100%{opacity:.25;transform:translateY(0)}40%{opacity:1;transform:translateY(-3px)}}
.cfg{padding:14px 18px}.cfg summary{font-weight:700}.cfg label{display:block;margin:12px 0;font-size:13px;color:var(--mute);font-weight:600}
.hubtabs{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 55%,transparent);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);padding:8px 0;margin:4px 0 12px}.hubtabs .btn{display:inline-flex;align-items:center;gap:7px}.hubtabs svg{width:16px;height:16px}
nav button[data-v=gv] svg{color:#9be3c0}nav button[data-v=gr] svg{color:#ffd37a}nav button[data-v=gf] svg{color:#8fd3ff}
.mapx{display:flex;flex-direction:column;gap:8px;background:color-mix(in srgb,var(--main) 4%,var(--card));border:1px solid var(--line);border-radius:14px;padding:12px;overflow:auto}
.mrow{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.ml{width:64px;flex:none;font-size:11px;font-weight:700;color:var(--mute);text-transform:uppercase}
.mc{border:1px solid var(--line);background:var(--card);border-radius:9px;padding:6px 10px;font-weight:700;font-size:12px;cursor:pointer;display:flex;flex-direction:column;align-items:center;min-width:62px;transition:transform .15s,box-shadow .2s}
.mc small{font-size:9px;font-weight:600;color:var(--mute)}.mc:hover{transform:translateY(-2px)}
.mc.Vendu{background:#e3f6ec;border-color:#9fd9ba}.mc.Réservé{background:#fdf1d9;border-color:#f0cf8a}.mc.Disponible{background:#e5effb;border-color:#a9c6ee}.mc.Àlouer{background:#fde7e7;border-color:#f1a9a9}.mc.Loué{background:#dff3f3;border-color:#93d2d2}
.mc.me{background:linear-gradient(135deg,var(--main),var(--main-2));color:#fff;border-color:transparent;box-shadow:0 0 0 3px color-mix(in srgb,var(--main) 30%,transparent);animation:pulse 1.8s ease-out infinite;color:#fff}.mc.me small{color:rgba(255,255,255,.8)}
.planimg{position:relative;display:inline-block;max-width:100%;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#fff}.planimg img{display:block;max-width:100%;max-height:60vh}
.planimg.placing{cursor:crosshair;outline:3px dashed var(--accent)}
.pin{position:absolute;width:18px;height:18px;margin:-9px 0 0 -9px;border-radius:50%;background:var(--bad);border:3px solid #fff;box-shadow:0 2px 8px rgba(0,0,0,.4);animation:pulse 1.6s ease-out infinite;color:var(--bad)}
.pin b{position:absolute;left:50%;top:-24px;transform:translateX(-50%);background:var(--bad);color:#fff;border-radius:6px;padding:1px 7px;font-size:11px;white-space:nowrap}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px;margin:8px 0 22px}
.tile{position:relative;overflow:hidden;text-align:left;font:inherit;color:inherit;cursor:pointer;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:20px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:6px;min-height:170px;transition:transform .25s cubic-bezier(.2,.8,.2,1),box-shadow .25s,border-color .25s;background-image:radial-gradient(120% 90% at 100% 0%,color-mix(in srgb,var(--k) 16%,transparent),transparent 60%)}
.tile:hover{transform:translateY(-5px);border-color:var(--k);box-shadow:0 22px 40px -22px var(--k)}
.tile .ti{width:48px;height:48px;border-radius:15px;display:grid;place-items:center;background:linear-gradient(135deg,var(--k),color-mix(in srgb,var(--k) 55%,#fff));color:#fff;margin-bottom:8px;box-shadow:0 10px 20px -10px var(--k);transition:transform .3s cubic-bezier(.3,1.6,.5,1)}
.tile:hover .ti{transform:scale(1.1) rotate(-6deg)}.tile .ti svg{width:26px;height:26px}
.tile b{font-size:18px;font-family:'Bricolage Grotesque',sans-serif;line-height:1.2}.tile span{color:var(--mute);font-size:13px;line-height:1.4}
.tile small{margin-top:auto;padding-top:8px;font-weight:700;color:var(--k);font-size:13px}
.tile::after{content:'›';position:absolute;right:18px;top:18px;font-size:26px;color:var(--mute);transition:transform .25s,color .25s}.tile:hover::after{transform:translateX(5px);color:var(--k)}
main.enter .tiles>*{animation:rise .55s cubic-bezier(.2,.8,.2,1) backwards}
main.enter .tiles>*:nth-child(2){animation-delay:.05s}main.enter .tiles>*:nth-child(3){animation-delay:.1s}main.enter .tiles>*:nth-child(4){animation-delay:.15s}main.enter .tiles>*:nth-child(5){animation-delay:.2s}main.enter .tiles>*:nth-child(6){animation-delay:.25s}main.enter .tiles>*:nth-child(n+7){animation-delay:.3s}
.crumb{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:-6px 0 16px;font-size:14px;color:var(--mute)}.crumb em{font-style:normal;opacity:.5}.crumb span{font-weight:700;color:var(--ink)}.crumb .lk{font-weight:600}
.f-leases,.f-charges{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));column-gap:18px;max-width:980px}.f-charges>h3,.f-charges>.row,.f-charges>.hint,.f-leases>h3,.f-leases>.row{grid-column:1/-1}
input.ro{background:color-mix(in srgb,var(--main) 6%,var(--card));font-weight:700}
.bellb{position:relative;background:var(--card);border:1px solid var(--line);border-radius:999px;width:42px;height:42px;font-size:18px;cursor:pointer;flex:none;margin-left:auto}.bellb[hidden]{display:none}
.bellb+#who{margin-left:0}#prt{margin-left:auto}#prt+#bell{margin-left:8px}#prt+#who{margin-left:8px}#bn{position:absolute;top:-4px;right:-4px;min-width:18px;height:18px;border-radius:9px;background:var(--bad);color:#fff;font-size:11px;font-weight:800;display:grid;place-items:center;padding:0 4px}#bn:empty{display:none}
.bellb.ring2{animation:bell 2.4s ease-in-out infinite;transform-origin:50% 0}
@keyframes bell{0%,60%,100%{transform:rotate(0)}65%{transform:rotate(14deg)}72%{transform:rotate(-12deg)}79%{transform:rotate(8deg)}86%{transform:rotate(-5deg)}}
.alertbar{display:flex;flex-direction:column;gap:3px;width:100%;text-align:left;font:inherit;cursor:pointer;margin:0 0 16px;padding:14px 18px;border-radius:16px;border:1px solid color-mix(in srgb,var(--warn) 50%,transparent);background:linear-gradient(120deg,color-mix(in srgb,var(--warn) 14%,var(--card)),var(--card));color:var(--ink);transition:transform .2s,box-shadow .2s}.alertbar:hover{transform:translateY(-2px);box-shadow:0 14px 28px -16px var(--warn)}.alertbar span{color:var(--mute);font-size:13px}

const phoneIntl=t=>{let n=String(t||'').replace(/[^\d+]/g,'');if(n.startsWith('+'))return n.slice(1);if(n.startsWith('00'))return n.slice(2);if(n.startsWith('0'))return '213'+n.slice(1);return n};
let SD={};
function sendDlg(o){
  SD=o;const d=$('#dlg');
  d.innerHTML=`<form id="sf" onsubmit="return false"><h3>Envoyer : ${esc(o.title)}</h3>
  <label>Téléphone (WhatsApp ou SMS)<input id="s_tel" value="${esc(o.phone||'')}" placeholder="0550 00 00 00"></label>
  <label>Adresse e-mail<input id="s_mail" type="email" value="${esc(o.email||'')}" placeholder="nom@exemple.com"></label>
  <label>Message<textarea id="s_txt" rows="10">${esc(o.text)}</textarea></label>
  <p style="color:var(--mute)">Choisissez le moyen d’envoi. Le message s’ouvre dans l’application choisie, prêt à être envoyé. Pour joindre le document sous forme de fichier, utilisez « Imprimer » puis « Enregistrer au format PDF ».</p>
  <div class="row"><button type="button" class="btn" onclick="sendVia('mail')">✉️ E-mail</button><button type="button" class="btn" onclick="sendVia('wa')">💬 WhatsApp</button><button type="button" class="btn" onclick="sendVia('sms')">📱 SMS</button><button type="button" class="btn ghost" onclick="sendVia('share')">📤 Partager…</button><button type="button" class="btn ghost" onclick="sendVia('copy')">📋 Copier</button><button type="button" class="btn ghost" onclick="this.closest('#dlg').close()">Fermer</button></div></form>`;
  if(!d.open)d.showModal();
}
function sendVia(k){
  const txt=$('#s_txt').value,tel=$('#s_tel').value,mail=$('#s_mail').value.trim(),sub=SD.title,me=(pset().email&&pset().cc)?pset().email:'';
  if(k==='mail')location.href='mailto:'+encodeURIComponent(mail)+'?subject='+encodeURIComponent(sub)+(me?'&cc='+encodeURIComponent(me):'')+'&body='+encodeURIComponent(txt);
  else if(k==='wa')window.open('https://wa.me/'+phoneIntl(tel)+'?text='+encodeURIComponent(txt),'_blank');
  else if(k==='sms')location.href='sms:'+tel.replace(/\s/g,'')+'?body='+encodeURIComponent(txt);
  else if(k==='share'){if(navigator.share)navigator.share({title:sub,text:txt}).catch(()=>{});else{toast('Partage indisponible sur cet appareil');}}
  else if(k==='copy'){(navigator.clipboard?navigator.clipboard.writeText(txt):Promise.reject()).then(()=>toast('Message copié'),()=>{$('#s_txt').select();document.execCommand&&document.execCommand('copy');toast('Message copié')})}
}
function sendDoc(t,bid,pid){
  const b=S.buyers.find(x=>x.id===bid),q=pid?S.pays.find(x=>x.id===pid):undefined;let pg;
  if(t==='ovr'){const f1=S.pays.filter(x=>x.bid===bid).sort((x,y)=>(x.date||'').localeCompare(y.date||''))[0];pg=docHtml('ov',b,{amount:+b.acompte||(f1?+f1.amount:0),note:(f1&&f1.note)||'acompte de réservation',mode:(f1&&f1.mode)||''})}
  else pg=docHtml(t,b,q);
  const o=soc(),sig='\n\n'+socNom()+(o.tel?'\nTél. '+o.tel:'')+(o.adr?'\n'+o.adr:'');
  sendDlg({title:pg[0]+' : '+b.name,text:html2txt(pg[1])+sig,phone:b.phone,email:b.email});
}

const PAPERS=['A4','A3','A5','Letter','Legal'];
const pset=()=>{S.pset=Object.assign({pname:'',ptype:'Laser',pconn:'Wi-Fi',pdev:'',pdone:false,paper:'A4',orient:'portrait',margin:12,scale:100,head:true,color:'Couleur',email:'',cc:true,profiles:[]},S.pset||{});return S.pset};
const pageCss=()=>{const o=pset();return `@page{size:${o.paper} ${o.orient};margin:${+o.margin||0}mm}`};
function applyPrint(){let st=document.getElementById('pstyle');if(!st){st=document.createElement('style');st.id='pstyle';document.head.appendChild(st)}
  const o=pset();st.textContent=`@media print{${pageCss()}body{zoom:${(+o.scale||100)/100}${o.color==='Noir et blanc'?';filter:grayscale(1)':''}}${o.head?'':'.prnhead{display:none!important}'}}`}
function printNow(){if(isMob()){exportView('print');return}applyPrint();window.print()}
function printDlg(){
  const d=$('#dlg'),o=pset(),opt=(arr,v)=>arr.map(x=>`<option${x===v?' selected':''}>${x}</option>`).join('');
  d.innerHTML=`<form id="pf2" onsubmit="return false"><h3>Imprimer</h3>
  <p style="color:var(--mute)">Imprimante configurée : <b>${esc(o.pname||'aucune')}</b> <button type="button" class="btn sm" onclick="printSetup()">⚙️ Configurer l’imprimante</button></p>

  <label>Profil d’imprimante<select id="p_prof" onchange="profLoad()"><option value="">Réglages actuels</option>${o.profiles.map((x,i)=>`<option value="${i}">${esc(x.name)}</option>`).join('')}</select></label>
  <label>Nom du profil (ex. : Laser bureau A4, Traceur A3)<input id="p_pname" placeholder="Nom de l’imprimante ou du profil"></label>

  <p style="color:var(--mute)">Page affichée : <b>${esc(TABS.find(x=>x[0]===view)?TABS.find(x=>x[0]===view)[1]:'Page')}</b>. Le choix de l’imprimante, ou « Enregistrer au format PDF », se fait dans la fenêtre d’impression qui s’ouvre ensuite.</p>
  <label>Format du papier<select id="p_paper">${opt(PAPERS,o.paper)}</select></label>
  <label>Orientation<select id="p_orient">${opt(['portrait','landscape'],o.orient).replace('>portrait<','>Portrait<').replace('>landscape<','>Paysage<')}</select></label>
  <label>Couleur<select id="p_color">${opt(['Couleur','Noir et blanc'],o.color)}</select></label>
  <label>Marges (mm)<input id="p_margin" type="number" value="${o.margin}"></label>
  <label>Échelle (%)<input id="p_scale" type="number" value="${o.scale}"></label>
  <label style="display:flex;gap:8px;align-items:center"><input id="p_head" type="checkbox" style="width:auto"${o.head?' checked':''}> Imprimer l’en-tête de la société</label>
  <div class="row"><button type="button" class="btn" onclick="printGo()">Imprimer</button><button type="button" class="btn ghost" onclick="printSave()">Enregistrer les réglages</button><button type="button" class="btn ghost" onclick="this.closest('#dlg').close()">Fermer</button></div>
  <h3 style="margin-top:20px">Envoyer par e-mail</h3>
  <p style="color:var(--mute)">Ouvre votre application de messagerie avec le message prêt. Pour joindre le document, enregistrez-le d’abord en PDF depuis la fenêtre d’impression, puis ajoutez-le au message.</p>
  <label>Adresse du destinataire<input id="e_to" type="email" placeholder="nom@exemple.com"></label>
  <label>Objet<input id="e_obj" value="${esc(socNom())} : ${esc(TABS.find(x=>x[0]===view)?TABS.find(x=>x[0]===view)[1]:'document')}"></label>
  <label>Mon adresse e-mail<input id="e_me" type="email" value="${esc(o.email)}" placeholder="votre@adresse.com"></label>
  <label style="display:flex;gap:8px;align-items:center"><input id="e_cc" type="checkbox" style="width:auto"${o.cc?' checked':''}> M’envoyer une copie</label>
  <div class="row"><button type="button" class="btn" onclick="mailTo()">Écrire le message</button><button type="button" class="btn ghost" onclick="sendDlg({title:$('#e_obj').value,text:'Bonjour,\n\nVeuillez trouver ci-joint le document « '+$('#e_obj').value+' ».\n\nCordialement,\n'+socNom(),email:$('#e_to').value})">Autres moyens : WhatsApp, SMS…</button></div>
  <p style="color:var(--mute)">Pour changer d’imprimante ou en ajouter une, utilisez les paramètres d’imprimantes de votre ordinateur : elle apparaîtra ensuite dans la fenêtre d’impression.</p></form>`;
  if(!d.open)d.showModal();
}
function printSave(){const o=pset();o.paper=$('#p_paper').value;o.orient=$('#p_orient').value==='Paysage'?'landscape':($('#p_orient').value==='Portrait'?'portrait':$('#p_orient').value);o.color=$('#p_color').value;o.margin=+$('#p_margin').value||0;o.scale=+$('#p_scale').value||100;o.head=$('#p_head').checked;if($('#e_me'))o.email=$('#e_me').value;if($('#e_cc'))o.cc=$('#e_cc').checked;if($('#s_name')){o.pname=$('#s_name').value.trim();o.ptype=$('#s_type').value;o.pconn=$('#s_conn').value;o.pdev=$('#s_dev').value;o.pdone=true}save();applyPrint();toast('Réglages enregistrés')}
function profLoad(){const o=pset(),i=$('#p_prof').value;if(i==='')return;const x=o.profiles[+i];$('#p_paper').value=x.paper;$('#p_orient').value=x.orient==='landscape'?'Paysage':'Portrait';$('#p_margin').value=x.margin;$('#p_scale').value=x.scale;$('#p_color').value=x.color||'Couleur';$('#p_head').checked=x.head!==false;$('#p_pname').value=x.name}
function profSave(){const n=$('#p_pname').value.trim();if(!n){toast('Donnez un nom au profil');return}printSave();const o=pset(),x={name:n,paper:o.paper,orient:o.orient,margin:o.margin,scale:o.scale,color:o.color,head:o.head},i=o.profiles.findIndex(y=>y.name===n);if(i>=0)o.profiles[i]=x;else o.profiles.push(x);save();printDlg();toast('Profil enregistré')}
function profDel(){const o=pset(),i=$('#p_prof').value;if(i==='')return;o.profiles.splice(+i,1);save();printDlg()}

const stampInfo=()=>{const o=soc();if(o.stampOff)return null;return o.stamp?{src:o.stamp,w:o.stampw||400,h:o.stamph||160}:STAMP_DEF};
const stampTag=()=>{const s=stampInfo();if(!s)return '';const w=170,hh=Math.round(w*s.h/s.w);return `<img class="stmp" src="${s.src}" width="${s.w}" height="${s.h}" alt="Cachet" style="display:block;width:${w}px;height:${hh}px;margin:2px 0;mix-blend-mode:multiply">`};
function stampAll(pages){
  if(!pages||!stampInfo())return pages;
  const tag=stampTag();
  pages.forEach(pg=>{if(typeof pg[1]==='string'&&pg[1].indexOf('class="stmp"')<0&&/Le promoteur/.test(pg[1]))pg[1]=pg[1].replace(/(Le promoteur(?: \/ maître d’œuvre)?<br>(?:\([^)]*\))?)/g,'$1<br>'+tag)});
  return pages;
}
let STMP={img:null,rot:0};
function stampDraw(){
  const im=STMP.img,r=STMP.rot%360,sw=(r%180)?im.height:im.width,sh=(r%180)?im.width:im.height,k=Math.min(1,1100/Math.max(sw,sh)),w=Math.round(sw*k),hh=Math.round(sh*k);
  const c=document.createElement('canvas');c.width=w;c.height=hh;const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,w,hh);x.translate(w/2,hh/2);x.rotate(r*Math.PI/180);const dw=im.width*k,dh=im.height*k;x.drawImage(im,-dw/2,-dh/2,dw,dh);return c;
}
function stampProcess(c){
  const w=c.width,hh=c.height,x=c.getContext('2d'),d=x.getImageData(0,0,w,hh),p=d.data,T=new Float32Array(w*hh);let x0=w,x1=0,y0=hh,y1=0;
  for(let i=0;i<w*hh;i++){const r=p[i*4],g=p[i*4+1],b=p[i*4+2],t=Math.max(0,Math.min(1,((b-(r+g)/2)-35)/70));T[i]=t;if(t>0.6){const px=i%w,py=(i/w)|0;if(px<x0)x0=px;if(px>x1)x1=px;if(py<y0)y0=py;if(py>y1)y1=py}}
  if(x1<=x0||y1<=y0)return null;
  const pad=10;x0=Math.max(0,x0-pad);y0=Math.max(0,y0-pad);x1=Math.min(w-1,x1+pad);y1=Math.min(hh-1,y1+pad);
  const cw=x1-x0+1,ch=y1-y0+1,o=document.createElement('canvas');o.width=cw;o.height=ch;const ox=o.getContext('2d'),od=ox.createImageData(cw,ch);
  for(let yy=0;yy<ch;yy++)for(let xx=0;xx<cw;xx++){const t=T[(y0+yy)*w+x0+xx],j=(yy*cw+xx)*4;od.data[j]=255*(1-t)+20*t;od.data[j+1]=255*(1-t)+35*t;od.data[j+2]=255*(1-t)+165*t;od.data[j+3]=255}
  ox.putImageData(od,0,0);
  const k=Math.min(1,700/cw),f=document.createElement('canvas');f.width=Math.round(cw*k);f.height=Math.round(ch*k);f.getContext('2d').drawImage(o,0,0,f.width,f.height);return f;
}
function stampLoad(file){
  if(!file)return;const rd=new FileReader();
  rd.onload=()=>{const im=new Image();im.onload=()=>{STMP={img:im,rot:0};stampDlg()};im.onerror=()=>toast('Image illisible');im.src=rd.result};rd.readAsDataURL(file);
}
function stampDlg(){
  const d=$('#dlg'),c=stampDraw(),pv=stampProcess(c);
  d.innerHTML=`<h3>Cachet et signature</h3><p style="color:var(--mute);margin:0 0 8px">Le texte doit être lisible à l’endroit. Sinon, faites pivoter la photo. Le fond blanc ou gris est supprimé automatiquement.</p><div style="text-align:center;background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px;min-height:80px">${pv?`<img src="${pv.toDataURL('image/png')}" style="max-width:100%;max-height:260px">`:'<span style="color:var(--bad)">Aucun cachet bleu détecté. Essayez une photo plus nette ou plus proche.</span>'}</div><div class="row" style="margin-top:10px"><button class="btn ghost" id="st_r">↻ Pivoter</button><button class="btn" id="st_ok"${pv?'':' disabled'}>Enregistrer le cachet</button><button class="btn ghost" id="cx">Annuler</button></div>`;
  $('#cx').onclick=()=>d.close();$('#st_r').onclick=()=>{STMP.rot+=90;stampDlg()};
  $('#st_ok').onclick=()=>{if(!pv)return;const o=soc();o.stamp=pv.toDataURL('image/jpeg',.92);o.stampw=pv.width;o.stamph=pv.height;o.stampOff=false;save();d.close();render();toast('Cachet enregistré')};
  if(!d.open)d.showModal();
}

/* ---- Base commune (Supabase) : plusieurs PC, une seule base ---- */
const SYK='gestpromo_sync',SYQ='gestpromo_syq';
const syc=()=>{try{return JSON.parse(localStorage.getItem(SYK))||{}}catch(e){return {}}};
const sycSet=o=>{try{localStorage.setItem(SYK,JSON.stringify(Object.assign(syc(),o)))}catch(e){}};
let SY={v:0,tok:'',exp:0,dirty:false,busy:false,state:'off',msg:'',timer:null,conflict:false};
const syOn=()=>{const c=syc();return !!(c.on&&c.url&&c.key&&c.email&&c.pw)};
const syU=()=>String(syc().url||'').replace(/\/+$/,'');
const syWho=()=>CUSER||(ROLES[ROLE]||'Appareil');
async function syAuth(){
  if(SY.tok&&Date.now()<SY.exp)return SY.tok;const c=syc();
  const r=await fetch(syU()+'/auth/v1/token?grant_type=password',{method:'POST',headers:{apikey:c.key,'Content-Type':'application/json'},body:JSON.stringify({email:c.email,password:c.pw})});
  if(!r.ok)throw new Error('Connexion refusée : vérifiez l’adresse du projet, la clé, l’e-mail et le mot de passe.');
  const j=await r.json();SY.tok=j.access_token;SY.exp=Date.now()+Math.max(60,(j.expires_in||3600)-60)*1000;return SY.tok;
}
const syH=async x=>Object.assign({apikey:syc().key,Authorization:'Bearer '+await syAuth()},x||{});
async function syRemote(cols){
  const r=await fetch(syU()+'/rest/v1/gp_data?id=eq.main&select='+(cols||'data,rev,updated_by,updated_at'),{headers:await syH()});
  if(r.status===404||r.status===400)throw new Error('La table gp_data est introuvable : exécutez le script SQL dans Supabase.');
  if(!r.ok)throw new Error('Lecture impossible ('+r.status+')');
  return (await r.json())[0]||null;
}
function syPayload(){const d=JSON.parse(JSON.stringify(S));delete d.pset;d._auth=getAuth()||null;return d}
function syApply(rm){
  const d=rm.data||{},a=d._auth;delete d._auth;const ps=S.pset;
  S=fixS(d);S.pset=ps||S.pset;
  try{localStorage.setItem(KEY,JSON.stringify(S));if(a)localStorage.setItem(AUTHK,JSON.stringify(a))}catch(e){}
  sycSet({rev:rm.rev,last:Date.now()});SY.dirty=false;SY.conflict=false;
  if(ROLE&&!($('#dlg')||{}).open)render();
}
async function syPush(force){
  if(!syOn()||SY.busy)return;SY.busy=true;SY.state='sync';syChipUpd();const v0=SY.v;let again=false;
  try{
    const c=syc(),rev=+c.rev||0,body=JSON.stringify({data:syPayload(),rev:rev+1,updated_by:syWho(),updated_at:new Date().toISOString()});
    let rem=null;const head=await syH({'Content-Type':'application/json',Prefer:'return=representation'});
    if(!rev&&!force){rem=await syRemote('rev');if(rem){SY.conflict=true;SY.state='conflict';syChipUpd();syConflict();return}}
    let r;
    if(!rev&&!rem&&!force){r=await fetch(syU()+'/rest/v1/gp_data',{method:'POST',headers:head,body:JSON.stringify({id:'main',data:syPayload(),rev:1,updated_by:syWho()})});if(!r.ok)throw new Error('Écriture impossible ('+r.status+')');sycSet({rev:1,last:Date.now()})}
    else{
      const cur=force?await syRemote('rev'):null,rv=force?(cur?+cur.rev:0):rev;
      if(force&&!cur){r=await fetch(syU()+'/rest/v1/gp_data',{method:'POST',headers:head,body:JSON.stringify({id:'main',data:syPayload(),rev:1,updated_by:syWho()})});if(!r.ok)throw new Error('Écriture impossible ('+r.status+')');sycSet({rev:1,last:Date.now()})}
      else{r=await fetch(syU()+'/rest/v1/gp_data?id=eq.main&rev=eq.'+rv,{method:'PATCH',headers:head,body:JSON.stringify({data:syPayload(),rev:rv+1,updated_by:syWho(),updated_at:new Date().toISOString()})});
        if(!r.ok)throw new Error('Écriture impossible ('+r.status+')');const a=await r.json();
        if(!a.length){SY.conflict=true;SY.state='conflict';syChipUpd();syConflict();return}
        sycSet({rev:rv+1,last:Date.now()})}}
    if(SY.v===v0)SY.dirty=false;else again=true;SY.state='ok';SY.msg='';
  }catch(e){SY.state='err';SY.msg=e.message||'Hors ligne'}
  finally{SY.busy=false;if(again)setTimeout(()=>syPush(),500);syChipUpd();if(view==='sync'&&!($('#dlg')||{}).open)render()}
}
function syMark(){if(!syOn()||SY.applying)return;SY.dirty=true;SY.v++;if(SY.state==='ok')SY.state='sync';clearTimeout(SY.timer);if(!SY.conflict)SY.timer=setTimeout(()=>syPush(),2500);syChipUpd()}
async function syPull(silent){
  if(!syOn()||SY.busy)return;
  try{
    const rm=await syRemote('rev');
    if(!rm){if(!silent&&view==='sync')toast('La base commune est vide');return}
    if(+rm.rev>(+syc().rev||0)){
      if(SY.dirty){SY.conflict=true;SY.state='conflict';syChipUpd();syConflict();return}
      const full=await syRemote();syApply(full);SY.state='ok';toast('Données mises à jour par '+(full.updated_by||'un collègue'))
    }else if(SY.state!=='conflict'&&!SY.dirty)SY.state='ok';
  }catch(e){SY.state='err';SY.msg=e.message||'Hors ligne'}
  syChipUpd();
}
function syConflict(){
  const d=$('#dlg');if(d.open&&d.dataset.sy)return;
  d.dataset.sy='1';
  d.innerHTML=`<h3>⚠️ Les données ont été modifiées ailleurs</h3><p style="color:var(--mute)">Un autre appareil a enregistré des changements dans la base commune pendant que vous travailliez. Choisissez la version à conserver.</p><div class="row"><button class="btn" id="sy_a">Charger la base commune<br><small>(mes dernières modifications sur cet appareil seront perdues)</small></button><button class="btn ghost" id="sy_b">Garder ma version et écraser la base commune</button><button class="btn ghost" id="sy_c">Décider plus tard</button></div>`;
  const close=()=>{d.dataset.sy='';d.close()};
  $('#sy_a').onclick=async()=>{try{const full=await syRemote();syApply(full);SY.state='ok';close();render();toast('Base commune chargée')}catch(e){toast(e.message)}};
  $('#sy_b').onclick=async()=>{close();SY.conflict=false;SY.busy=false;await syPush(true);toast('Base commune remplacée par votre version')};
  $('#sy_c').onclick=close;
  if(!d.open)d.showModal();
}
/* fichiers (photos, scans, plans) */
const syq=()=>{try{return JSON.parse(localStorage.getItem(SYQ))||[]}catch(e){return []}};
const syqSet=a=>{try{localStorage.setItem(SYQ,JSON.stringify(a))}catch(e){}};
function syQueue(id){if(!syOn())return;const a=syq();if(!a.includes(id)){a.push(id);syqSet(a)}setTimeout(syFlush,300)}
async function syFlush(){
  if(!syOn()||SY.flushing)return;SY.flushing=true;
  try{for(const id of syq()){
    const r=await fgetL(id);
    if(r&&r.blob){const u=await fetch(syU()+'/storage/v1/object/gp-files/'+encodeURIComponent(id),{method:'POST',headers:await syH({'Content-Type':r.blob.type||'application/octet-stream','x-upsert':'true'}),body:r.blob});if(!u.ok)throw new Error('Envoi du fichier impossible ('+u.status+')')}
    syqSet(syq().filter(x=>x!==id))}}
  catch(e){SY.msg=e.message}finally{SY.flushing=false}
}

async function syConnect(){

  const c={url:g('sy_url').trim().replace(/\/+$/,''),key:g('sy_key').trim(),email:g('sy_mail').trim(),pw:g('sy_pw')};
  if(!c.url||!c.key||!c.email||!c.pw){alert('Remplissez les quatre champs.');return}
  localStorage.setItem(SYK,JSON.stringify(Object.assign({},c,{on:false,rev:0})));SY.tok='';
  try{
    await syAuth();const rm=await syRemote('rev,updated_by,updated_at');

const NLU=['zéro','un','deux','trois','quatre','cinq','six','sept','huit','neuf','dix','onze','douze','treize','quatorze','quinze','seize','dix-sept','dix-huit','dix-neuf'],NLT=['','','vingt','trente','quarante','cinquante','soixante'];
const nl99=(n,fin)=>{if(n<20)return NLU[n];if(n<70){const t=Math.floor(n/10),u=n%10;return NLT[t]+(u===1?' et un':u?'-'+NLU[u]:'')}if(n<80){const u=n-60;return 'soixante'+(u===11?' et onze':'-'+NLU[u])}const u=n-80;return 'quatre-vingt'+(u?'-'+NLU[u]:(fin?'s':''))};
const nl999=(n,fin)=>{const c=Math.floor(n/100),r=n%100;let s='';if(c)s=(c>1?NLU[c]+' ':'')+'cent'+(c>1&&!r&&fin?'s':'');if(r)s+=(s?' ':'')+nl99(r,fin);return s};
function nl(n){n=Math.round(+n||0);if(n===0)return 'zéro';let s='';for(const [v,w] of [[1e9,'milliard'],[1e6,'million']]){const q=Math.floor(n/v);if(q){s+=(s?' ':'')+nl999(q,true)+' '+w+(q>1?'s':'');n%=v}}const th=Math.floor(n/1000);if(th){s+=(s?' ':'')+(th===1?'mille':nl999(th,false)+' mille');n%=1000}if(n)s+=(s?' ':'')+nl999(n,true);return s}

/* ---- Import de l'état descriptif (Word .docx ou PDF) ---- */
const HK=[['orientation',/orient/i],['ilot',/[iî]lot/i],['surface',/surf|superficie|m²/i],['type',/type|nature|d[ée]signation|typologie|cat[ée]gorie/i],['etage',/[ée]tage|niveau/i],['loc',/localisation|b[aâ]timent|bloc|situation|position|emplacement/i],['ref',/r[ée]f|logt|lot|n[°o]|num[ée]ro|code/i]];
const hk=c=>{const t=c.replace(/m2/gi,'m²');if(/\d/.test(t)||t.length>35)return;return (HK.find(([,r])=>r.test(t))||[])[0]};
const num=s=>parseFloat(String(s).replace(/\s/g,'').replace(',','.').replace(/[^\d.]/g,''))||0;
function parseRows(rows){
  let map=null,out=[];
  rows.forEach(r=>{
    const m={};r.forEach((c,i)=>{const k=hk(c);if(k&&!(k in m))m[k]=i});
    if(Object.keys(m).length>=3){map=m;return}
    if(!map)return;
    const g=k=>k in map?(r[map[k]]||'').trim():'';
    const u={ref:g('ref'),ilot:g('ilot'),etage:g('etage'),orientation:g('orientation'),loc:g('loc'),type:g('type'),surface:num(g('surface'))};
    if(!u.ref||(!u.surface&&!u.type))return;
    const t=(u.type+' '+u.ref+' '+u.loc).toLowerCase();
    u.louer=/\blouer\b|\ba louer\b|\blocation\b/.test(norm(r.join(' ')));
    u.kind=/parking|garage|box|stationnement/.test(t)?'Parking':/bureau/.test(t)?'Bureau':/local|commerc|magasin/.test(t)?'Local':'Logement';
    out.push(u);
  });
  return out;
}
async function readDocx(f){
  const r=await mammoth.convertToHtml({arrayBuffer:await f.arrayBuffer()});
  const d=new DOMParser().parseFromString(r.value,'text/html');
  const tr=[...d.querySelectorAll('tr')];
  if(tr.length)return tr.map(t=>[...t.children].map(c=>c.textContent.trim()));
  return [...d.querySelectorAll('p')].map(p=>p.textContent.trim().split(/\t| {2,}/));
}
async function readPdf(f){
  pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
  const pdf=await pdfjsLib.getDocument({data:await f.arrayBuffer()}).promise,rows=[];
  for(let n=1;n<=pdf.numPages;n++){
    const items=(await(await pdf.getPage(n)).getTextContent()).items.filter(i=>i.str.trim()),lines=[];
    items.forEach(i=>{const y=Math.round(i.transform[5]);let l=lines.find(l=>Math.abs(l.y-y)<3);if(!l)lines.push(l={y,it:[]});l.it.push(i)});
    lines.sort((a,b)=>b.y-a.y).forEach(l=>{
      l.it.sort((a,b)=>a.transform[4]-b.transform[4]);
      const cells=[];let last=null;
      l.it.forEach(i=>{const x=i.transform[4];
        if(last!==null&&x-last<8)cells[cells.length-1]+=' '+i.str.trim();else cells.push(i.str.trim());
        last=x+i.width});
      rows.push(cells);
    });
  }
  return rows;
}
async function importEtat(f){
  try{
    const n=f.name.toLowerCase();let rows;
    if(!S.projects.length){alert('Créez d’abord un projet.');return}
    if(n.endsWith('.docx')){if(!window.mammoth)throw'lib';rows=await readDocx(f)}
    else if(n.endsWith('.pdf')){if(!window.pdfjsLib)throw'lib';rows=await readPdf(f)}
    else{alert('Format non pris en charge. Utilisez un fichier .docx (Word) ou .pdf. Pour un ancien fichier .doc, enregistrez-le d’abord en .docx.');return}
    const u=parseRows(rows);
    if(!u.length){alert('Aucun tableau reconnu. Le fichier doit contenir un tableau avec des colonnes comme N° logt, Îlot, Localisation, Type et Superficie. Un PDF scanné (image) ne peut pas être lu.');return}
    askImport(u);
  }catch(e){alert(e==='lib'?'Les outils de lecture n’ont pas pu se charger. Vérifiez votre connexion internet.':'Impossible de lire ce fichier.')}
}

/* formulaire */
let RLINES=[];

function rlAdd(){rlRead();RLINES.push({});rlRefresh()}

function rlRefresh(){const k=$('#rf').dataset.k,old=$('#rf').querySelector('[data-rlbox]');old.innerHTML=rlinesHtml(k).replace(/^<div style="grid-column:1\/-1;overflow-x:auto">/,'').replace(/<\/div>$/,'')}

function rzCheck(k,r){

async function rzParseXl(f){
  if(!window.XLSX)throw 'lib';
  const wb=XLSX.read(await f.arrayBuffer(),{type:'array'});
  return rzRowsToLines(wb.SheetNames.map(sn=>[sn,XLSX.utils.sheet_to_json(wb.Sheets[sn],{header:1,defval:''})]))}
function rzRowsToLines(sheets){
  const out=[],nz=v=>String(v==null?'':v).trim(),nm=v=>nz(v).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,''),num=v=>typeof v==='number'?v:(parseFloat(nz(v).replace(/\s/g,'').replace(',','.'))||0);
  sheets.forEach(([sn,R])=>{
    if(/recap|factur|reste/i.test(sn))return;
    const hi=R.findIndex(r=>r.some(c=>/^(designation|des)/.test(nm(c))));
    if(hi<0)return;
    const H=R[hi].map(nm),col=re=>H.findIndex(h=>re.test(h)),c={lot:col(/^lot/),ref:col(/^(ref|art)/),des:col(/^(designation|des)/),u:col(/^(u|unite)$/),qty:col(/^(quantite|qte|qt)/),pu:col(/^(p[\/.]?u|prix)/)};
    let lot=sn;
    R.slice(hi+1).forEach(r=>{
      const des=nz(r[c.des]),ref=c.ref>=0?nz(r[c.ref]):'';
      if(!des||/^(sous-?total|total)/.test(nm(des))||/^(sous-?total|total)/.test(nm(ref)))return;
      const q=c.qty>=0?num(r[c.qty]):0,pu=c.pu>=0?num(r[c.pu]):0;
      if(!q&&!pu)return;
      out.push({lot:(c.lot>=0&&nz(r[c.lot]))||lot,ref,des,u:c.u>=0?nz(r[c.u]):'',qty:q,pu});
    });

}

async function hashPw(pw,salt){
  try{if(window.crypto&&crypto.subtle){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(salt+':'+pw));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}}catch(e){}
  let h1=0xdeadbeef,h2=0x41c6ce57;const t=salt+':'+pw;for(let i=0;i<t.length;i++){const c=t.charCodeAt(i);h1=Math.imul(h1^c,2654435761);h2=Math.imul(h2^c,1597334677)}
  h1=Math.imul(h1^(h1>>>16),2246822507)^Math.imul(h2^(h2>>>13),3266489909);h2=Math.imul(h2^(h2>>>16),2246822507)^Math.imul(h1^(h1>>>13),3266489909);
  return 'f'+(4294967296*(2097151&h2)+(h1>>>0)).toString(16);
}

async function saveAuth(){
  let a=getAuth()||{salt:uid()+uid(),h:{}};a.h=a.h||{};let n=0;
  for(const r of Object.keys(ROLES)){
    const v=($('#pw-'+r)||{}).value||'';if(!v)continue;
    if(v.length<4){alert('Le mot de passe « '+ROLES[r]+' » doit contenir au moins 4 caractères.');return}
    a.h[r]=await hashPw(v,a.salt);n++;
  }
  if(!a.h.admin){alert('Définissez d’abord le mot de passe de l’administrateur.');return}
  if(!n){toast('Rien à enregistrer');return}
  try{localStorage.setItem(AUTHK,JSON.stringify(a));sessionStorage.setItem(SESK,'admin');sessionStorage.setItem(SESU,'')}catch(e){alert('Impossible d’enregistrer dans ce navigateur.');return}

/* ---- Recherche d'un acheteur ou d'un lot ---- */
const norm=x=>String(x??'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase();
function search(qs){
  const sr=$('#sr'),T=norm(qs).split(/\s+/).filter(Boolean);
  if(!T.length){sr.hidden=true;return}
  const sales=ROLE==='admin'||ROLE==='ventes',R=[],CT=[];
  if(sales){
    allCts().forEach(c=>{const r=c.rec,hay=norm([r.cno,c.kind,r.name,r.phone,r.idn,r.names,r.addr,c.u.ref,pname(c.u.pid)].join(' '));if(T.every(t=>hay.includes(t)))CT.push(c)});
    S.units.forEach(u=>{
      const b=S.buyers.find(x=>x.uid===u.id),extra=[...S.leases.filter(l=>l.uid===u.id),...S.hres.filter(r=>r.uid===u.id)].map(x=>[x.name,x.names,x.cno].join(' ')).join(' '),
      h2=norm([u.ref,u.kind,u.type,u.ilot,u.etage,u.orientation,u.loc,u.dest,u.status,u.who,pname(u.pid),b&&b.name,b&&b.phone,b&&b.addr,b&&b.idn,extra].join(' '));
      if(T.every(t=>h2.includes(t)))R.push({u,b});
    });
  }
  let html=CT.slice(0,10).map(c=>`<button class="res" data-a="ctlot" data-id="${c.rec.uid}"><b>${esc(c.rec.cno)}</b> · ${c.kind} · ${esc(c.rec.name)}<br><small>Lot ${esc(c.u.ref||'—')} · ${esc(pname(c.u.pid))}</small></button>`).join('');
  html+=R.slice(0,10).map(({u,b})=>`<button class="res" data-a="unit" data-id="${u.id}"><b>${esc(u.ref)}</b> · ${esc(u.type)}${u.ilot?' · îlot '+esc(u.ilot):''}${u.etage?' · étage '+esc(u.etage):''}<br><small>${esc(pname(u.pid))} · ${esc(u.dest||u.status)}${b?' · '+esc(b.name):u.who?' · '+esc(u.who):''}</small></button>`).join('');
  if(ROLE==='admin'||allowed('gr')){const hq=hqResults(qs);if(hq&&!/Aucun résultat/.test(hq))html+='<div style="padding:4px 6px"><small style="color:var(--mute)">Réalisation : sous-traitants, ODS, factures…</small>'+hq+'</div>'}
  sr.innerHTML=html||'<div class="empty">Aucun résultat.</div>';
  sr.hidden=false;
}
$('#q').addEventListener('input',e=>search(e.target.value));
$('#q').addEventListener('keydown',e=>{if(e.key==='Escape')$('#sr').hidden=true});
document.addEventListener('click',e=>{if(!e.target.closest('#sr,#q'))$('#sr').hidden=true});

function updDevis(){

  const tot=devHT(devPid),set=(id,v)=>{const e=document.getElementById(id);if(e)e.textContent=v};
  S.lots.filter(l=>l.pid===devPid).forEach(l=>{

async function importDevis(f,pid){
  try{
    if(!window.XLSX)throw 'lib';
    const wb=XLSX.read(await f.arrayBuffer(),{type:'array'}),res=[];
    wb.SheetNames.forEach(sn=>{
      if(/recap/i.test(sn))return;
      const R=XLSX.utils.sheet_to_json(wb.Sheets[sn],{header:1,defval:''}),hi=R.findIndex(r=>String(r[0]).trim().toUpperCase()==='ART');
      if(hi<0)return;
      const items=[];let name='';
      R.slice(hi+1).forEach(r=>{
        const a=String(r[0]).trim(),b=String(r[1]).trim();
        if(!a&&b&&!name)name=b;
        if(a&&b&&!/^total/i.test(a))items.push({ref:a,des:b,u:String(r[2]).trim(),qty:parseFloat(r[3])||0,pu:parseFloat(r[4])||0});
      });
      if(items.length)res.push({code:(items[0].ref.split('.')[0]||sn[0]).toUpperCase(),name:name||sn,items});
    });
    if(!res.length){alert('Aucun article reconnu. Le fichier doit avoir un onglet par lot, avec les colonnes ART, DESIGNATION DES OUVRAGES, U, QUANTITE et P/UNITAIRE.');return}
    if(!confirm(res.length+' lots et '+res.reduce((t,l)=>t+l.items.length,0)+' articles trouvés. Les ajouter au projet « '+pname(pid)+' » ?'))return;
    res.forEach(l=>{const lid=uid();S.lots.push({id:lid,pid,code:l.code,name:l.name,sub:''});l.items.forEach(i=>S.items.push({id:uid(),lid,sub:'',...i}))});
    save();render();
  }catch(e){alert(e==='lib'?'L’outil de lecture Excel n’a pas pu se charger. Vérifiez votre connexion internet.':'Impossible de lire ce fichier.')}
}

V.bilan=()=>{
  const P=S.projects.filter(p=>!fp||p.id===fp),sm=f=>P.reduce((t,p)=>t+f(p.id),0);
  const cin=sm(cashIn),paid=sm(paidOf),due=sm(pid=>sum(chOf(pid),'amount')-paidOf(pid)),ca=sm(caPrev),cost=sm(pid=>costPrev(pid).total),profit=ca-cost,mg=ca?Math.round(profit/ca*1000)/10:0;
  const kp=(v,l)=>`<div class="kpi"><b>${v}</b><span>${l}</span></div>`,pc=v=>`<span style="color:var(${v>=0?'--ok':'--bad'})">${fmt(v)}</span>`;
  const cmp=(l,v,m,c)=>`<div style="display:flex;align-items:center;gap:10px;margin:8px 0"><span style="width:190px;font-size:14px">${l}</span><div style="flex:1;background:var(--line);border-radius:6px;height:14px"><i class="cb" style="display:block;height:100%;width:${Math.max(0,v)/m*100}%;background:${c};border-radius:6px"></i></div><b style="min-width:120px;text-align:right">${fmt(v)}</b></div>`;
  const m1=Math.max(cin,paid,1),m2=Math.max(ca,cost,1);
  const byCat=CATS.map(c=>{const x=S.charges.filter(h=>P.some(p=>p.id===h.pid)&&h.cat===c),t=sum(x,'amount');return [c,t,sum(x.filter(h=>h.status==='Payé'),'amount')]}).filter(r=>r[1]>0);
  const ct=sum(byCat.map(r=>({a:r[1]})),'a');
  const T={};
  P.forEach(p=>{
    const U=S.units.filter(u=>u.pid===p.id);if(!U.length)return;
    const tc=costPrev(p.id).total,w=u=>S.alloc==='equal'?1:(+u.surface||0);
    let tw=sum(U.map(u=>({w:w(u)})),'w');const eq=tw===0;if(eq)tw=U.length;
    U.forEach(u=>{const lb=(u.type||'Non précisé').trim(),r=T[lb.toLowerCase()]||(T[lb.toLowerCase()]={t:lb,n:0,s:0,c:0,pn:0,ps:0});
      r.n++;r.s+=+u.surface||0;r.c+=tc*((eq?1:w(u))/tw);if(u.price>0){r.pn++;r.ps+=+u.price}});
  });
  const TR=Object.values(T).sort((a,b)=>a.t.localeCompare(b.t,undefined,{numeric:true}));
  return `<h2>Bilan : encaissements, charges et bénéfice</h2><div class="tools">${projSel()}</div>
  <div class="kpis">${kp(fmt(cin),'Encaissé (versements des acheteurs)')}${kp(fmt(paid),'Charges payées')}${kp(pc(cin-paid),'Solde de trésorerie')}${kp(fmt(due),'Charges restant à payer')}${kp(fmt(sm(owed)),'Créances clients à encaisser')}</div>
  <div class="wrap" style="padding:14px;margin-bottom:16px"><b>Réel à ce jour</b>${cmp('Encaissements',cin,m1,'var(--ok)')}${cmp('Charges payées',paid,m1,'var(--bad)')}
  <b style="display:block;margin-top:14px">Prévisionnel à la fin du projet</b>${cmp('Chiffre d’affaires prévu',ca,m2,'var(--main)')}${cmp('Coût de revient prévu',cost,m2,'var(--warn)')}</div>
  <div class="kpis">${kp(pc(profit),'Bénéfice prévisionnel')}${kp(mg+' %','Marge sur chiffre d’affaires')}</div>
  <h2>Par projet</h2>
  ${table(['Projet','Encaissé','Charges payées','Solde','CA prévu','Coût prévu','Bénéfice prévu','Marge'],P.map(p=>{const c=costPrev(p.id).total,a=caPrev(p.id);return [esc(p.name),fmt(cashIn(p.id)),fmt(paidOf(p.id)),pc(cashIn(p.id)-paidOf(p.id)),fmt(a),fmt(c),pc(a-c),a?Math.round((a-c)/a*1000)/10+' %':'—']}))}
  <p style="color:var(--mute)">Coût prévu = travaux (le plus élevé entre le devis TTC et les travaux déjà engagés dans les Charges) + les autres charges. Chiffre d’affaires prévu = prix des lots disponibles, réservés et vendus. Les logements loués ne sont pas comptés dans le chiffre d’affaires.</p>
  <h2 style="margin-top:22px">Charges par catégorie</h2>
  ${table(['Catégorie','Total','Payé','À payer','Part'],byCat.map(r=>[esc(r[0]),fmt(r[1]),fmt(r[2]),fmt(r[1]-r[2]),Math.round(r[1]/ct*100)+' %']))}
  <h2 style="margin-top:22px">Coût de réalisation par type de logement</h2>
  <div class="tools"><select data-f="alloc"><option value="surface"${S.alloc==='surface'?' selected':''}>Répartition du coût selon la superficie</option><option value="equal"${S.alloc==='equal'?' selected':''}>Répartition à parts égales par lot</option></select></div>
  ${table(['Type','Nombre','Superficie totale','Coût de réalisation total','Coût moyen par lot','Prix de vente moyen','Marge moyenne par lot'],TR.map(r=>{const ac=r.c/r.n,ap=r.pn?r.ps/r.pn:0;return [esc(r.t),r.n,Math.round(r.s*100)/100+' m²',fmt(r.c),fmt(ac),ap?fmt(ap):'—',ap?pc(ap-ac):'—']}))}
  <p style="color:var(--mute)">Le coût prévu de chaque projet est réparti entre ses lots, puis regroupé par type (F2, F3, local commercial, parking…). La marge moyenne n’est calculée que pour les types qui ont un prix de vente.</p>`;
};

/* ---- Reçus bancaires scannés (stockés dans le navigateur, base IndexedDB) ---- */
let scanPay=null,scanK='pays',curUnit=null;
const DB=()=>new Promise((res,rej)=>{const r=indexedDB.open('gestpromo_files',1);r.onupgradeneeded=()=>r.result.createObjectStore('f');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});
const fputL=async(id,v)=>{const db=await DB();return new Promise((res,rej)=>{const t=db.transaction('f','readwrite');t.objectStore('f').put(v,id);t.oncomplete=res;t.onerror=()=>rej(t.error)})};
const fput=async(id,v)=>{await fputL(id,v);try{syQueue(id)}catch(e){}};
const fgetL=async id=>{const db=await DB();return new Promise((res,rej)=>{const r=db.transaction('f').objectStore('f').get(id);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})};
const fget=async id=>{const r=await fgetL(id);if(r)return r;try{return await syDown(id)}catch(e){return r}};
const fdel=async id=>{const db=await DB();await new Promise((res,rej)=>{const t=db.transaction('f','readwrite');t.objectStore('f').delete(id);t.oncomplete=res;t.onerror=()=>rej(t.error)});try{syRemoveFile(id)}catch(e){}};
const fall=async()=>{const db=await DB();return new Promise((res,rej)=>{const st=db.transaction('f').objectStore('f'),k=st.getAllKeys(),v=st.getAll();v.onsuccess=()=>res(k.result.map((x,i)=>[x,v.result[i]]));v.onerror=()=>rej(v.error)})};
const toDataURL=b=>new Promise(r=>{const f=new FileReader();f.onload=()=>r(f.result);f.readAsDataURL(b)});
function dropFiles(pays){pays.forEach(q=>(q.scans||[]).forEach(f=>fdel(f.id).catch(()=>{})))}

const snapKey=d=>'snap_'+d;
async function autoSnap(){try{const d=new Date().toISOString().slice(0,10),all=await fall(),keys=all.map(x=>x[0]).filter(k=>String(k).startsWith('snap_')).sort();
  await fput(snapKey(d),{name:'snap',type:'json',json:JSON.stringify(S),at:Date.now()});
  const ks=[...new Set(keys.concat(snapKey(d)))].sort();for(const k of ks.slice(0,Math.max(0,ks.length-7)))await fdel(k)}catch(e){}}
async function snapList(){const box=document.getElementById('snaps');if(!box)return;let l=[];try{l=(await fall()).filter(x=>String(x[0]).startsWith('snap_')&&x[1]&&x[1].json).sort((a,b)=>String(b[0]).localeCompare(String(a[0])))}catch(e){}
  const lb=+(localStorage.getItem('gestpromo_lastbk')||0);
  box.innerHTML=`<p>Dernière sauvegarde exportée : <b>${lb?new Date(lb).toLocaleString('fr-FR'):'jamais'}</b></p>`+(l.length?`<p style="margin-bottom:4px">Copies automatiques de sécurité (7 derniers jours, dans ce navigateur) :</p>`+l.map(x=>`<div style="display:flex;gap:8px;align-items:center;margin:4px 0"><span>${dt(String(x[0]).slice(5))}</span><button type="button" class="btn ghost sm" data-a="snaprest" data-id="${esc(x[0])}">Restaurer</button></div>`).join(''):'<p style="color:var(--mute)">Aucune copie automatique pour l’instant.</p>')}
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}

const TODAY=()=>ymd(new Date());
const cE=v=>`<b class="c-enc">${fmt(v)}</b>`;
const cN=v=>v>0?`<b class="c-nenc">${fmt(v)}</b>`:`<b class="c-zero">${fmt(0)}</b>`;
const cD=v=>v>0?`<b class="c-dep">${fmt(v)}</b>`:`<b class="c-zero">${fmt(0)}</b>`;
const cMix=(non,dep)=>dep>0?`<b class="c-dep">${fmt(non)}</b><br><small class="c-dep">dont ${fmt(dep)} en retard</small>`:cN(non);
const leftC=b=>{const l=left(b);return l<=0?cE(0):cMix(l,b.due&&b.due<TODAY()?l:0)};
const stTag=(enc,non,dep)=>dep>0?'<span class="tag c-dep">Délai dépassé</span>':non>0?'<span class="tag c-nenc">Non encaissé</span>':enc>0?'<span class="tag c-enc">Encaissé</span>':'—';
const leg=()=>'<p class="leg"><span class="c-enc">● Vert : encaissé</span><span class="c-nenc">● Orange : non encaissé</span><span class="c-dep">● Rouge : délai dépassé</span></p>';
const kc=(v,l,c,t)=>`<div class="kpi" style="--k:var(${c})"><b class="${t||''}">${v}</b><span>${l}</span></div>`;
const pOk=(u,pid)=>pid?u.pid===pid:(!fp||u.pid===fp);

function schedSale(b,tot){return (b.ech&&b.ech.length)?b.ech:[{date:b.due||'',amount:tot}]}
function depOf(sch,enc){const td=TODAY();let rest=enc,d=0;[...sch].sort((a,b)=>(a.date||'').localeCompare(b.date||'')).forEach(e=>{const a=+e.amount||0,p=Math.min(a,rest);rest-=p;if(e.date&&e.date<td)d+=a-p});return d}
function saleOf(b,u){const tot=+b.price||+(u&&u.price)||0,enc=paidBy(b.id),non=Math.max(0,tot-enc);return {b,tot,enc,non,dep:Math.min(non,depOf(schedSale(b,tot),enc))}}
function saleInfo(u){const b=S.buyers.find(x=>x.uid===u.id);return b?saleOf(b,u):{b:null,tot:0,enc:0,non:0,dep:0}}
function leaseSched(l){const months=+l.months||12,step=l.mode==='Totalité'?months:(l.reglt==='Annuel'?12:l.reglt==='Semestriel'?6:1),rent=+l.rent||0,td=TODAY(),o=[];for(let i=0;i*step<months;i++)o.push({date:addMonths(l.start||td,i*step),amount:rent*Math.min(step,months-i*step)});return o}
function leaseInfo(l){
  const months=+l.months||12,step=l.mode==='Totalité'?months:(l.reglt==='Annuel'?12:l.reglt==='Semestriel'?6:1),rent=+l.rent||0,td=TODAY();
  let tot=0,ech=0;
  for(let i=0;i*step<months;i++){const a=rent*Math.min(step,months-i*step);tot+=a;if(addMonths(l.start||td,i*step)<=td)ech+=a}
  const enc=sum(S.rpays.filter(r=>r.lid===l.id),'amount');
  if(l.closed)tot=Math.min(tot,Math.max(ech,enc));
  const non=Math.max(0,tot-enc);
  return {tot,enc,non,dep:Math.min(non,Math.max(0,ech-enc)),ech};
}
function unitFin(u){
  if(SALE.includes(u.status)){const s=saleInfo(u);return {who:s.b?s.b.name:'',tot:s.tot,enc:s.enc,non:s.non,dep:s.dep,due:s.b?s.b.due:''}}
  if(u.status==='Loué'||u.status==='À louer'){const L=S.leases.filter(l=>l.uid===u.id),a=L.map(leaseInfo),act=L.find(l=>!l.closed);return {who:act?act.name:'',tot:sum(a,'tot'),enc:sum(a,'enc'),non:sum(a,'non'),dep:sum(a,'dep'),due:act?act.end:''}}

const nightsOf=r=>(r.from&&r.to)?Math.max(0,Math.round((new Date(r.to+'T00:00:00')-new Date(r.from+'T00:00:00'))/86400000)):0;
const hrate=r=>{const u=S.units.find(x=>x.id===r.uid);return +r.rate||+(u&&u.nightly)||0};
const hStat=r=>{if(r.rstat==='Annulée')return 'Annulée';const td=TODAY();return !r.from||td<r.from?'Réservée':td<r.to?'En séjour':'Terminée'};
function hInfo(r){
  const n=nightsOf(r),tot=r.rstat==='Annulée'?0:n*hrate(r)+(+r.extra||0),enc=sum(S.hpays.filter(p=>p.rid===r.id),'amount'),non=Math.max(0,tot-enc);

const hOk=r=>{const u=S.units.find(x=>x.id===r.uid);return !!u&&pOk(u)};
function agg(kind,pid){

  const SU=U.filter(u=>SALE.includes(u.status)),si=SU.map(saleInfo);

/* ---- Formulaire de contrat ---- */
function ctUnits(kind,cur){
  const hasB=id=>S.buyers.some(b=>b.uid===id),hasL=id=>S.leases.some(l=>l.uid===id&&!l.closed);
  let U=S.units.filter(u=>pOk(u));
  if(kind==='Vente')U=U.filter(u=>(u.dest==='Vente'||SALE.includes(u.status))&&!hasB(u.id));
  else if(kind==='Location')U=U.filter(u=>(u.dest==='Location'||['À louer','Loué'].includes(u.status))&&!hasL(u.id));
  else U=U.filter(u=>kOf(u)==='Logement'&&u.dest==='Hôtellerie');
  if(cur&&!U.some(u=>u.id===cur)&&unitOf(cur).id)U.push(unitOf(cur));
  return U;

/* ===== Liaisons : coût du lot, à faire, synthèse par projet, actions rapides ===== */
function lotCost(u){
  const C=S.charges.filter(c=>c.pid===u.pid),ht=c=>({a:(+c.amount||0)-tvaIn(c)});
  const direct=sum(C.filter(c=>c.lot===u.id).map(ht),'a'),common=sum(C.filter(c=>!c.lot).map(ht),'a');
  const tot=sum(S.units.filter(x=>x.pid===u.pid),'surface'),share=tot>0?common*(+u.surface||0)/tot:0;
  return {direct,share,total:direct+share};
}
function lotLinkHtml(u){
  const C=allCts().filter(c=>c.rec.uid===u.id),lc=lotCost(u),cost=+u.cost||0,rv=tvaRate('vente');
  const rows=C.map(c=>{const f=ctFin(c.kind,c.rec);return [esc(c.rec.cno),c.kind,esc(c.rec.name),fmt(f.tot),cE(f.enc),cMix(f.non,f.dep),stTag(f.enc,f.non,f.dep),`<button class="btn sm" data-a="ctpay" data-kind="${c.kind}" data-id="${c.rec.id}">Paiements</button>`]});
  const kd=u.dest==='Location'?'Location':u.dest==='Hôtellerie'?'Hôtellerie':'Vente',over=cost>0&&lc.total>cost;
  const m=[['Coût estimé (état descriptif)',cost?fmt(cost):'—'],['Dépenses directes de ce lot (HT)',fmt(lc.direct)],['Part des dépenses communes du projet (HT, selon la superficie)',fmt(lc.share)],['<b>Coût réel (HT)</b>',`<b class="${over?'c-dep':''}">${fmt(lc.total)}</b>${over?' <span class="tag c-dep">dépasse l’estimation</span>':''}`]];
  if(SALE.includes(u.status)&&+u.price>0){const pht=u.price/(1+rv),mg=pht-lc.total;m.push(['Prix de vente HT',fmt(pht)],['<b>Marge estimée</b>',mg>=0?cE(mg):cD(-mg)])}
  return `<h3 class="sec">Contrats du lot</h3>${table(['N°','Qualité','Client','Montant','Encaissé','Non encaissé','État',''],rows)}
  <div class="row" style="justify-content:flex-start"><button class="btn" data-a="ctnew" data-kind="${kd}" data-id="${u.id}">Nouveau contrat de ${kd==='Vente'?'vente':kd==='Location'?'location':'séjour'}</button></div>
  <h3 class="sec">Coût et marge</h3>${table(['',''],m)}`;
}

/* ---- À faire aujourd’hui ---- */
function todoItems(){
  const td=TODAY(),lim=addD(td,7),out=[],cb=(kind,id,l)=>['ctpay',kind,id,l],money=ROLE!=='real';
  (money?allCts():[]).filter(c=>(!fp||c.u.pid===fp)&&!c.rec.closed&&!(c.kind==='Hôtellerie'&&c.rec.rstat==='Annulée')).forEach(c=>{
    const r=c.rec,f=ctFin(c.kind,r),lot=c.u.ref||'—';
    if(f.dep>0)out.push({lv:0,tag:'Retard',cls:'c-dep',txt:`${r.name} · lot ${lot} · ${fmt(f.dep)} en retard (${r.cno})`,btn:cb(c.kind,r.id,'Encaisser')});
    else{const nx=allocRows(ctSched(c.kind,r),f.enc).find(e=>e.left>0&&e.date&&e.date>=td&&e.date<=lim);
      if(nx)out.push({lv:1,tag:'Échéance proche',cls:'c-nenc',txt:`${r.name} · lot ${lot} · ${fmt(nx.left)} le ${dt(nx.date)} (${r.cno})`,btn:cb(c.kind,r.id,'Paiements')})}
  });
  (money?alerts():[]).filter(a=>a.t==='Location').forEach(a=>out.push({lv:1,tag:'Fin de contrat',cls:'c-nenc',txt:a.text,btn:['go','cont','Contrats']}));
  (money?S.hres:[]).filter(r=>hOk(r)&&r.rstat!=='Annulée').forEach(r=>{const u=unitOf(r.uid),f=hInfo(r);
    if(r.from===td||r.from===addD(td,1))out.push({lv:2,tag:'Arrivée',cls:'',txt:`${r.name} · ${u.ref} · ${r.from===td?'aujourd’hui':'demain'} (${dt(r.from)})${r.pay==='Check-in'&&f.non>0?' · à encaisser : '+fmt(f.non):''}`,btn:cb('Hôtellerie',r.id,'Paiements')});
    if(r.to===td)out.push({lv:2,tag:'Départ',cls:'',txt:`${r.name} · ${u.ref} · départ aujourd’hui${f.non>0?' · à encaisser : '+fmt(f.non):''}`,btn:cb('Hôtellerie',r.id,'Paiements')})});
  const sj=S.charges.filter(c=>(!fp||c.pid===fp)&&trate(c)>0&&!justif(c));
  if(sj.length)out.push({lv:2,tag:'Facture',cls:'c-nenc',txt:`${sj.length} facture(s) d’achat sans justificatif : ${fmt(sum(sj.map(c=>({a:tvaIn(c)})),'a'))} de TVA non récupérable`,btn:['go','fisc','Voir']});
  const ap=S.charges.filter(c=>(!fp||c.pid===fp)&&c.status!=='Payé');
  if(ap.length)out.push({lv:2,tag:'À payer',cls:'c-nenc',txt:`${ap.length} dépense(s) à payer : ${fmt(sum(ap,'amount'))}`,btn:['go','charges','Voir']});
  const sc=(money?S.units:[]).filter(u=>pOk(u)&&(u.dest==='Vente'||u.dest==='Location')&&!allCts().some(c=>c.rec.uid===u.id&&!c.rec.closed));
  if(sc.length)out.push({lv:3,tag:'Lots libres',cls:'',txt:`${sc.length} lot(s) sans contrat (vente ou location) : ${sc.slice(0,6).map(u=>u.ref).join(', ')}${sc.length>6?'…':''}`,btn:['go','etat','État descriptif']});
  S.units.filter(u=>pOk(u)&&+u.cost>0&&lotCost(u).total>u.cost).forEach(u=>out.push({lv:2,tag:'Coût dépassé',cls:'c-dep',txt:`Lot ${u.ref} : coût réel ${fmt(lotCost(u).total)} pour une estimation de ${fmt(u.cost)}`,btn:['unit',u.id,'Fiche du lot']}));
  const n=new Date();if(n.getDate()<=20){const pm=new Date(n.getFullYear(),n.getMonth()-1,1);out.push({lv:2,tag:'Fiscalité',cls:'',txt:`G50 de ${MOIS[pm.getMonth()]} ${pm.getFullYear()} à déposer avant le 20/${String(n.getMonth()+1).padStart(2,'0')}/${n.getFullYear()}`,btn:['go','g50','Ouvrir la G50']})}
  return out.sort((a,b)=>a.lv-b.lv);
}

/* ---- Synthèse par projet : encaissé, à encaisser, payé, à payer, TVA ---- */
function projFin(pid){
  const P=fPaysTva([pid]),A=agg(null,pid),C=S.charges.filter(c=>c.pid===pid),sv=fp;let rz;fp=pid;try{rz=rzTotals()}finally{fp=sv}
  const T=C.filter(c=>trate(c)>0),col=colTva(P),ded=sum(T.filter(justif).map(c=>({a:tvaIn(c)})),'a');
  return {enc:sum(P,'amount'),non:A.sale.non+A.rent.non+A.hot.non,dep:A.sale.dep+A.rent.dep+A.hot.dep,paid:sum(C.filter(c=>c.status==='Payé'),'amount'),due:sum(C.filter(c=>c.status!=='Payé'),'amount')+Math.max(0,rz.net-rz.pay),col,ded};
}
function projSum(){const L=S.projects.filter(p=>!fp||p.id===fp).map(p=>({p,f:projFin(p.id)}));const t=k=>sum(L.map(x=>x.f),k);return {L,enc:t('enc'),non:t('non'),dep:t('dep'),paid:t('paid'),due:t('due'),col:t('col'),ded:t('ded')}}
function argKpis(){const s=projSum(),net=s.col-s.ded;return kc(fmt(s.enc),'Encaissé','--ok','c-enc')+kc(fmt(s.non-s.dep),'À encaisser','--or','c-nenc')+kc(fmt(s.dep),'Retards','--bad','c-dep')+kc(fmt(s.paid),'Payé','--blue')+kc(fmt(s.due),'À payer','--bad')+kc(net>=0?fmt(net):'Crédit '+fmt(-net),'TVA à payer',net>0?'--bad':'--ok')}
V.liaison=()=>{
  const s=projSum(),net=s.col-s.ded;
  const row=(l,f)=>[l,cE(f.enc),cMix(f.non,f.dep),fmt(f.paid),cN(f.due),fmt(f.col),fmt(f.ded),(f.col-f.ded)>=0?fmt(f.col-f.ded):'Crédit '+fmt(f.ded-f.col),fmt(f.enc-f.paid)];
  return `<h2>Synthèse : encaissé, payé et TVA</h2><div class="tools">${projSel()}</div>${leg()}
  <div class="kpis">${argKpis()}${kc(fmt(s.enc-s.paid),'Trésorerie (encaissé − payé)',s.enc-s.paid>=0?'--ok':'--bad',s.enc-s.paid>=0?'c-enc':'c-dep')}</div>
  <h3 class="sec">Par projet (chaque projet est séparé)</h3>
  ${table(['Projet','Encaissé','À encaisser','Payé','À payer','TVA collectée','TVA déductible','TVA à payer','Trésorerie'],s.L.map(({p,f})=>row(esc(p.name),f)).concat(s.L.length>1?[row('<b>Total</b>',s)]:[]))}
  <p style="color:var(--mute)">Encaissé = ventes, loyers et séjours reçus. À encaisser = reste dû sur les contrats (rouge : délai dépassé). Payé et à payer = dépenses et marchés de réalisation. TVA : collectée sur les encaissements (vente ${S.tvaR.vente} %, location ${S.tvaR.loc} %, hôtellerie ${S.tvaR.hot} %), déductible sur les factures justifiées.</p>
  <div class="tools"><button class="btn ghost" data-a="go" data-id="caisse">Caisse</button><button class="btn ghost" data-a="go" data-id="fisc">Fiscalité (TVA)</button><button class="btn ghost" data-a="go" data-id="g50">G50</button><button class="btn ghost" data-a="go" data-id="dues">Créances</button></div>`;
};
